<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OmniBot — Discord anywhere</title><link rel="stylesheet" href="public/styles.css"><style>body{display:grid;place-items:center;min-height:100vh;background:#0b0c10}.hero{max-width:760px;text-align:center;padding:32px}.hero h1{font-size:clamp(3rem,10vw,7rem);margin:0}.hero p{font-size:1.25rem;color:#b7bbc8;line-height:1.6}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:28px 0}.cta{border:0;border-radius:14px;padding:15px 22px;font:inherit;font-weight:700;background:#5865f2;color:white;text-decoration:none;cursor:pointer}.cta.alt{background:#20232d}.code{background:#11131a;border:1px solid #292d3a;border-radius:14px;padding:18px;text-align:left;overflow:auto}</style></head><body><main class="hero"><div class="orb logo" style="margin:auto">O</div><h1>OmniBot</h1><p>Your Discord server, anywhere. Invite the bot, then drop a live Discord-style channel onto your website with one iframe.</p><div class="actions"><a id="invite" class="cta" href="#">Invite OmniBot</a><a class="cta alt" href="public/index.html">Open OmniBot</a></div><pre class="code" id="embed-code">&lt;iframe src="public/embed.html?guild=GUILD_ID&amp;channel=CHANNEL_ID" width="100%" height="600" frameborder="0"&gt;&lt;/iframe&gt;</pre></main><script src="config.js"></script><script>(async()=>{try{const api=window.OMNIBOT_API;if(!api||api.includes('YOUR_'))return;const c=await fetch(api.replace(/\/$/,'')+'/api/config').then(r=>r.json());if(c.inviteUrl)document.getElementById('invite').href=c.inviteUrl}catch(e){console.warn(e)}})()</script></body></html>
